name: Update ToonShow Hindi Video Sitemap

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-toonshow-video-sitemap
  cancel-in-progress: true

jobs:
  update-video-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Video Sitemap
        shell: python
        env:
          BLOG_URL: "https://www.toonshowhindi.in/"
        run: |
          import html
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape

          BLOG_URL = "https://www.toonshowhindi.in/"
          FEED_BASE = BLOG_URL + "feeds/posts/default"
          OUTPUT = "video-sitemap.xml"

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "ToonShowHindi-VideoSitemap/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          def clean_html(value):
              if not value:
                  return ""

              value = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  value,
                  flags=re.I | re.S
              )
              value = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  value,
                  flags=re.I | re.S
              )
              value = re.sub(
                  r"<noscript\b[^>]*>.*?</noscript>",
                  " ",
                  value,
                  flags=re.I | re.S
              )
              value = re.sub(r"<[^>]+>", " ", value)
              value = html.unescape(value)
              value = re.sub(r"\s+", " ", value).strip()

              return value

          def youtube_id(value):
              if not value:
                  return None

              patterns = [
                  r"youtube\.com/embed/([A-Za-z0-9_-]{11})",
                  r"youtube-nocookie\.com/embed/([A-Za-z0-9_-]{11})",
                  r"youtube\.com/watch\?[^\"' <>\n]*[?&]v=([A-Za-z0-9_-]{11})",
                  r"youtu\.be/([A-Za-z0-9_-]{11})",
                  r"youtube\.com/shorts/([A-Za-z0-9_-]{11})",
              ]

              for pattern in patterns:
                  match = re.search(pattern, value, re.I)
                  if match:
                      return match.group(1)

              return None

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "media": "http://search.yahoo.com/mrss/"
          }

          entries = []
          seen_urls = set()
          seen_videos = set()
          start_index = 1
          page_count = 0

          while True:
              feed_url = (
                  FEED_BASE
                  + "?alt=atom&max-results=150"
                  + "&start-index="
                  + str(start_index)
              )

              try:
                  data = fetch(feed_url)
              except Exception as exc:
                  print("Feed request failed:", exc)
                  break

              root = ET.fromstring(data)
              page_entries = root.findall("atom:entry", ns)
              page_count += 1

              print(
                  "Feed page",
                  page_count,
                  "start-index",
                  start_index,
                  "entries",
                  len(page_entries)
              )

              if not page_entries:
                  break

              for entry in page_entries:
                  link = None

                  for item in entry.findall("atom:link", ns):
                      rel = item.attrib.get("rel")
                      href = item.attrib.get("href", "")

                      if rel == "alternate" and href.startswith(BLOG_URL):
                          link = href
                          break

                  if not link or link in seen_urls:
                      continue

                  content_node = entry.find("atom:content", ns)
                  summary_node = entry.find("atom:summary", ns)

                  raw_content = (
                      content_node.text
                      if content_node is not None
                      else ""
                  )

                  raw_summary = (
                      summary_node.text
                      if summary_node is not None
                      else ""
                  )

                  video = youtube_id(raw_content)

                  if not video:
                      video = youtube_id(raw_summary)

                  if not video or video in seen_videos:
                      continue

                  description = clean_html(raw_content)

                  if not description:
                      description = clean_html(raw_summary)

                  if not description:
                      description = "Watch this Hindi animated story on ToonShow Hindi."

                  description = description[:2048].strip()

                  entries.append({
                      "url": link,
                      "video": video,
                      "description": description
                  })

                  seen_urls.add(link)
                  seen_videos.add(video)

              if len(page_entries) < 150:
                  break

              start_index += 150

          urlset = ET.Element(
              "urlset",
              {
                  "xmlns": "http://www.sitemaps.org/schemas/sitemap/0.9",
                  "xmlns:video": "http://www.google.com/schemas/sitemap-video/1.1"
              }
          )

          for item in entries:
              url = ET.SubElement(urlset, "url")

              loc = ET.SubElement(url, "loc")
              loc.text = item["url"]

              video_node = ET.SubElement(url, "{http://www.google.com/schemas/sitemap-video/1.1}video")

              thumbnail = ET.SubElement(
                  video_node,
                  "{http://www.google.com/schemas/sitemap-video/1.1}thumbnail_loc"
              )
              thumbnail.text = (
                  "https://img.youtube.com/vi/"
                  + item["video"]
                  + "/maxresdefault.jpg"
              )

              title_node = ET.SubElement(
                  video_node,
                  "{http://www.google.com/schemas/sitemap-video/1.1}title"
              )
              title_node.text = item["description"][:100]

              description_node = ET.SubElement(
                  video_node,
                  "{http://www.google.com/schemas/sitemap-video/1.1}description"
              )
              description_node.text = item["description"]

              player = ET.SubElement(
                  video_node,
                  "{http://www.google.com/schemas/sitemap-video/1.1}player_loc"
              )
              player.text = (
                  "https://www.youtube.com/embed/"
                  + item["video"]
                  + "?rel=0"
              )

          tree = ET.ElementTree(urlset)
          ET.indent(tree, space="  ")

          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )

          # Validate generated XML
          ET.parse(OUTPUT)

          if not entries:
              raise RuntimeError("No video pages were generated.")

          print()
          print("Blogger feed pages read:", page_count)
          print("Generated Video Sitemap with", len(entries), "video pages")
          print("XML validation: OK")

      - name: Commit updated sitemap
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add video-sitemap.xml

          if git diff --cached --quiet; then
            echo "No sitemap changes detected."
            exit 0
          fi

          git commit -m "Update ToonShow Hindi video sitemap"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push rejected. Retrying..."
            sleep 3
          done

          echo "Unable to push after 5 attempts."
          exit 1
