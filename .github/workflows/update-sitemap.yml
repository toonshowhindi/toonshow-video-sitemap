name: Update ToonShow Hindi Video Sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-video-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Video Sitemap
        shell: python
        run: |
          import re
          import html
          import urllib.request
          import xml.etree.ElementTree as ET

          BLOG_URL = "https://www.toonshowhindi.in/"
          FEED_BASE = (
              "https://www.toonshowhindi.in/"
              "feeds/posts/default?alt=atom"
              "&max-results=150"
          )

          SITEMAP_NS = "http://www.sitemaps.org/schemas/sitemap/0.9"
          VIDEO_NS = "http://www.google.com/schemas/sitemap-video/1.1"
          ATOM_NS = "http://www.w3.org/2005/Atom"

          ET.register_namespace("", SITEMAP_NS)
          ET.register_namespace("video", VIDEO_NS)

          def clean_html(value):
              value = html.unescape(value or "")

              value = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<noscript\b[^>]*>.*?</noscript>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value
              )

              value = html.unescape(value)
              value = re.sub(r"\s+", " ", value)

              return value.strip()

          def youtube_id(text):
              patterns = [
                  r"youtube(?:-nocookie)?\.com/embed/([A-Za-z0-9_-]{11})",
                  r"youtube\.com/watch\?[^\"'<>\s]*[?&]v=([A-Za-z0-9_-]{11})",
                  r"youtu\.be/([A-Za-z0-9_-]{11})"
              ]

              for pattern in patterns:
                  match = re.search(pattern, text or "", re.I)

                  if match:
                      return match.group(1)

              return None

          def fetch_feed(start_index):
              url = (
                  FEED_BASE
                  + "&start-index="
                  + str(start_index)
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "ToonShow-Hindi-Video-Sitemap/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return response.read()

          urlset = ET.Element(
              f"{{{SITEMAP_NS}}}urlset"
          )

          seen_urls = set()
          seen_videos = set()

          start_index = 1
          page_count = 0

          while True:
              feed_data = fetch_feed(start_index)
              root = ET.fromstring(feed_data)

              entries = root.findall(
                  f"{{{ATOM_NS}}}entry"
              )

              if not entries:
                  break

              page_count += 1

              for entry in entries:
                  title_node = entry.find(
                      f"{{{ATOM_NS}}}title"
                  )

                  content_node = entry.find(
                      f"{{{ATOM_NS}}}content"
                  )

                  summary_node = entry.find(
                      f"{{{ATOM_NS}}}summary"
                  )

                  title = (
                      title_node.text
                      if title_node is not None
                      else ""
                  )

                  title = clean_html(title)

                  raw_content = ""

                  if content_node is not None:
                      raw_content = content_node.text or ""

                  if not raw_content and summary_node is not None:
                      raw_content = summary_node.text or ""

                  video = youtube_id(raw_content)

                  if not video:
                      continue

                  post_url = ""

                  for link in entry.findall(
                      f"{{{ATOM_NS}}}link"
                  ):
                      if link.get("rel") == "alternate":
                          post_url = link.get(
                              "href",
                              ""
                          )
                          break

                  if not post_url:
                      continue

                  if not post_url.startswith(BLOG_URL):
                      continue

                  if post_url in seen_urls:
                      continue

                  if video in seen_videos:
                      continue

                  description = clean_html(
                      raw_content
                  )

                  description = re.sub(
                      r"\s+",
                      " ",
                      description
                  ).strip()

                  if not description:
                      description = title

                  if len(description) > 2048:
                      description = (
                          description[:2045]
                          + "..."
                      )

                  url_node = ET.SubElement(
                      urlset,
                      f"{{{SITEMAP_NS}}}url"
                  )

                  loc_node = ET.SubElement(
                      url_node,
                      f"{{{SITEMAP_NS}}}loc"
                  )

                  loc_node.text = post_url

                  video_node = ET.SubElement(
                      url_node,
                      f"{{{VIDEO_NS}}}video"
                  )

                  thumbnail_node = ET.SubElement(
                      video_node,
                      f"{{{VIDEO_NS}}}thumbnail_loc"
                  )

                  thumbnail_node.text = (
                      "https://img.youtube.com/vi/"
                      + video
                      + "/maxresdefault.jpg"
                  )

                  title_node = ET.SubElement(
                      video_node,
                      f"{{{VIDEO_NS}}}title"
                  )

                  title_node.text = title[:2048]

                  description_node = ET.SubElement(
                      video_node,
                      f"{{{VIDEO_NS}}}description"
                  )

                  description_node.text = description

                  player_node = ET.SubElement(
                      video_node,
                      f"{{{VIDEO_NS}}}player_loc"
                  )

                  player_node.text = (
                      "https://www.youtube.com/embed/"
                      + video
                      + "?rel=0"
                  )

                  seen_urls.add(post_url)
                  seen_videos.add(video)

              if len(entries) < 150:
                  break

              start_index += 150

          ET.indent(
              urlset,
              space="  "
          )

          tree = ET.ElementTree(
              urlset
          )

          tree.write(
              "video-sitemap.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print(
              "Blogger feed pages read:",
              page_count
          )

          print(
              "Generated Video Sitemap with",
              len(seen_urls),
              "video pages."
          )

      - name: Validate sitemap XML
        shell: python
        run: |
          import xml.etree.ElementTree as ET

          tree = ET.parse(
              "video-sitemap.xml"
          )

          root = tree.getroot()

          if not root.tag.endswith("urlset"):
              raise SystemExit(
                  "Invalid sitemap root element."
              )

          urls = root.findall(
              "{http://www.sitemaps.org/schemas/sitemap/0.9}url"
          )

          if not urls:
              raise SystemExit(
                  "Sitemap contains no video URLs."
              )

          print(
              "Video Sitemap XML validation: OK"
          )

          print(
              "Video URL entries:",
              len(urls)
          )

      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add video-sitemap.xml

          if git diff --cached --quiet; then
            echo "No sitemap changes."
          else
            git commit -m "Update ToonShow Hindi video sitemap"
            git push
          fi
